name: Morning Market Data

on:
  schedule:
    - cron: '58 7 * * 1-5' # 08:00 IST, Mon–Fri; avoids crowded quarter-hour slots.
      timezone: "Asia/Kolkata"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  morning-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx tsx scripts/morning-market.ts

      - name: Commit morning cues and global ledger
        run: |
          git config user.name "kosh-bot"
          git config user.email "kosh-bot@users.noreply.github.com"
          git pull --rebase --autostash
          git add -A data/
          git diff --staged --quiet || git commit -m "chore(data): morning market cues $(date -u +%Y-%m-%d)"
          git push
